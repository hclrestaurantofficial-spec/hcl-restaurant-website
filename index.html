<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Veloura Models | Berlin</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

header{
text-align:center;
padding:60px;
background:black;
}

header h1{
font-size:50px;
color:#d4af37;
}

nav{
text-align:center;
background:#111;
padding:15px;
}

nav a{
color:white;
margin:20px;
text-decoration:none;
font-size:18px;
}

.hero{
text-align:center;
padding:100px 20px;
background:url("https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e") center/cover;
}

.hero h2{
font-size:40px;
background:rgba(0,0,0,0.6);
display:inline-block;
padding:20px;
}

section{
padding:60px 20px;
text-align:center;
}

.gallery{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.gallery img{
width:250px;
height:320px;
object-fit:cover;
border-radius:10px;
}

form{
max-width:450px;
margin:auto;
background:#111;
padding:30px;
border-radius:10px;
}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
}

button{
background:#d4af37;
color:black;
padding:12px;
border:none;
width:100%;
font-size:16px;
cursor:pointer;
}

footer{
background:black;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>
</head>

<body>

<header>
<h1>Veloura Models</h1>
<p>Luxury Modeling Agency - Berlin, Germany</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#gallery">Models</a>
<a href="#apply">Apply</a>
<a href="#contact">Contact</a>
</nav>

<div class="hero">
<h2>Become The Face Of Luxury Fashion</h2>
</div>

<section id="gallery">

<h2>Our Models</h2>

<div class="gallery">

<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330">
<img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c">
<img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1">
<img src="https://images.unsplash.com/photo-1517841905240-472988babdf9">
<img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e">
<img src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df">

</div>

</section>

<section id="apply">

<h2>Model Application</h2>

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email" required>

<input type="number" placeholder="Age" required>

<select required>
<option>Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input type="text" placeholder="Height (cm)">

<input type="file">

<textarea placeholder="Tell us about yourself"></textarea>

<button type="submit">Submit Application</button>

</form>

</section>

<section id="contact">

<h2>Contact</h2>

<p>Email: contact@velouramodels.com</p>
<p>Berlin, Germany</p>

</section>

<footer>

<p>© 2026 Veloura Models Agency</p>

</footer>

</body>
</html>
